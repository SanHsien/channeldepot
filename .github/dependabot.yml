version: 2
updates:
  # Python 執行期、開發與建置依賴；increase 會同步推進目前使用 >= 宣告的最低版本。
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Taipei"
    versioning-strategy: "increase"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    # 延後中的依賴不讓 Dependabot 調高下限（#33 曾把 imageio-ffmpeg 推到 0.8.1、#34 推到 0.8.0，皆不採用）。
    # 解除延後時，先刪 .github/dependency-deferrals.json 的對應項，再刪這裡。
    ignore:
      - dependency-name: "imageio-ffmpeg"
        versions: [">=0.8.0"]
    groups:
      runtime-dependencies:
        dependency-type: "production"
      development-minor-and-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      development-major:
        dependency-type: "development"
        update-types: ["major"]

  # checkout、setup-python、CodeQL、artifact 與 Release actions。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
